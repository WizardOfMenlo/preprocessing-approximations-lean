name = "LatticePrepro"
version = "0.1.0"
defaultTargets = ["LatticePrepro", "AxiomCheck"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "LatticePrepro"

# Pins the axioms used by the main theorems; `lake build` fails if they change.
[[lean_lib]]
name = "AxiomCheck"
