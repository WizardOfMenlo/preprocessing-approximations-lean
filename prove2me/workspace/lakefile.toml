# Prove2Me staging workspace: Lean v4.33.1 + Mathlib 0df444a (the platform's default environment).
# `LatticePrepro` is the ported copy of the repo sources (see ../scripts/port_433.sh); the other
# three libraries mirror the platform's module layout and are generated by ../scripts/generate.py.
name = "prove2me"
version = "0.1.0"
defaultTargets = ["Definitions", "Theorems", "Solutions"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "LatticePrepro"

[[lean_lib]]
name = "Definitions"
globs = ["Definitions.+"]

[[lean_lib]]
name = "Theorems"
globs = ["Theorems.+"]

[[lean_lib]]
name = "Solutions"
globs = ["Solutions.+"]
